<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <title>Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #map { width: 100%; height: 100%; }
    .leaflet-control-zoom { border: none !important; }
    .leaflet-control-zoom a {
      background: rgba(255, 255, 255, 0.9) !important;
      color: #334155 !important;
      border: 1px solid rgba(0, 0, 0, 0.1) !important;
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      width: 28px !important;
      height: 28px !important;
      line-height: 28px !important;
      font-size: 14px !important;
    }
    .leaflet-control-zoom a:hover {
      background: rgba(255, 255, 255, 1) !important;
      border-color: rgba(0, 0, 0, 0.2) !important;
    }
    .leaflet-control-attribution {
      background: rgba(255, 255, 255, 0.8) !important;
      color: rgba(100, 116, 139, 0.8) !important;
      font-size: 9px !important;
      -webkit-backdrop-filter: blur(4px);
      backdrop-filter: blur(4px);
    }
    .leaflet-control-attribution a { color: rgba(71, 85, 105, 0.8) !important; }
    .custom-marker {
      width: 20px;
      height: 20px;
      background: #0891b2;
      border: 3px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 2px 8px rgba(8, 145, 178, 0.4), 0 0 0 2px rgba(8, 145, 178, 0.15);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.7; }
    }
    .custom-popup .leaflet-popup-content-wrapper {
      background: #0f1729;
      color: #e2e8f0;
      border: 1px solid rgba(8, 145, 178, 0.3);
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 13px;
      line-height: 1.5;
    }
    .custom-popup .leaflet-popup-content {
      margin: 12px 16px;
    }
    .custom-popup .leaflet-popup-content strong {
      color: #67e8f9;
      font-size: 14px;
    }
    .custom-popup .leaflet-popup-tip {
      background: #0f1729;
      border: 1px solid rgba(8, 145, 178, 0.3);
      border-top: none;
      border-left: none;
    }
    .custom-popup .leaflet-popup-close-button {
      color: #94a3b8 !important;
    }
    .custom-popup .leaflet-popup-close-button:hover {
      color: #67e8f9 !important;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    const map = L.map('map', {
      center: [50.05882, 8.23970],
      zoom: 15,
      zoomControl: true,
      attributionControl: true,
      scrollWheelZoom: false,
      dragging: true
    });
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> &copy; <a href="https://carto.com/">CARTO</a>',
      subdomains: 'abcd',
      maxZoom: 19
    }).addTo(map);
    const markerIcon = L.divIcon({
      className: '',
      html: '<div class="custom-marker"></div>',
      iconSize: [24, 24],
      iconAnchor: [12, 12]
    });
    L.marker([50.05882, 8.23970], { icon: markerIcon })
      .addTo(map)
      .bindPopup('<strong>Fabian Tepel Steuerberatung</strong><br>Gottfried-Kinkel-Straße 21<br>65187 Wiesbaden', {
        className: 'custom-popup',
        offset: [0, -8]
      });
  </script>
</body>
</html>
