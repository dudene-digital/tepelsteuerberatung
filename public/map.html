<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #map { width: 100%; height: 100%; }
    .leaflet-control-zoom { border: none !important; }
    .leaflet-control-zoom a {
      background: rgba(15, 23, 42, 0.85) !important;
      color: #a5e7ff !important;
      border: 1px solid rgba(165, 231, 255, 0.15) !important;
      backdrop-filter: blur(8px);
      width: 28px !important;
      height: 28px !important;
      line-height: 28px !important;
      font-size: 14px !important;
    }
    .leaflet-control-zoom a:hover {
      background: rgba(15, 23, 42, 0.95) !important;
      border-color: rgba(165, 231, 255, 0.3) !important;
    }
    .leaflet-control-attribution {
      background: rgba(15, 23, 42, 0.7) !important;
      color: rgba(165, 231, 255, 0.4) !important;
      font-size: 9px !important;
      backdrop-filter: blur(4px);
    }
    .leaflet-control-attribution a { color: rgba(165, 231, 255, 0.5) !important; }
    .custom-marker {
      width: 24px;
      height: 24px;
      background: radial-gradient(circle, #a5e7ff 0%, #00d2ff 40%, transparent 70%);
      border-radius: 50%;
      box-shadow: 0 0 16px rgba(0, 210, 255, 0.5), 0 0 32px rgba(0, 210, 255, 0.2);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.7; }
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    const map = L.map('map', {
      center: [50.0617, 8.2435],
      zoom: 15,
      zoomControl: true,
      attributionControl: true,
      scrollWheelZoom: false,
      dragging: true
    });
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> &copy; <a href="https://carto.com/">CARTO</a>',
      subdomains: 'abcd',
      maxZoom: 19
    }).addTo(map);
    const markerIcon = L.divIcon({
      className: '',
      html: '<div class="custom-marker"></div>',
      iconSize: [24, 24],
      iconAnchor: [12, 12]
    });
    L.marker([50.0617, 8.2435], { icon: markerIcon }).addTo(map);
  </script>
</body>
</html>
